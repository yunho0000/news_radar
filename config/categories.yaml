# 카테고리 목록
# 카테고리 추가 = 아래에 항목 하나 추가. 끄려면 enabled: false
#
# rss: 이 카테고리의 뉴스 RSS 주소 목록.
#      여기 나온 헤드라인에 등장한 키워드만 이 카테고리로 판별한다 (기획서 5장).
#      - name:   알아보기 위한 이름 (로그에 나옴)
#      - url:    RSS 주소
#      - outlet: (선택) 언론사 한 곳의 피드일 때 언론사 이름.
#                구글 뉴스처럼 기사마다 언론사가 적혀 오는 피드는 비워 둔다.
#      피드 추가·삭제 = 줄 추가·삭제. 피드 하나가 실패해도 나머지는 계속 수집한다.

categories:
  - id: entertainment
    name: 연예
    enabled: true
    rss:
      - name: 구글 뉴스 - 엔터테인먼트 섹션
        url: "https://news.google.com/rss/headlines/section/topic/ENTERTAINMENT?hl=ko&gl=KR&ceid=KR:ko"
      - name: 연합뉴스 - 연예
        url: "https://www.yna.co.kr/rss/entertainment.xml"
        outlet: 연합뉴스

  - id: sports
    name: 스포츠
    enabled: true
    rss:
      - name: 구글 뉴스 - 스포츠 섹션
        url: "https://news.google.com/rss/headlines/section/topic/SPORTS?hl=ko&gl=KR&ceid=KR:ko"
      - name: 연합뉴스 - 스포츠
        url: "https://www.yna.co.kr/rss/sports.xml"
        outlet: 연합뉴스
