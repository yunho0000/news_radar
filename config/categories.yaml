# 카테고리 목록
# 카테고리 추가 = 아래에 항목 하나 추가. 끄려면 enabled: false
#
# rss: 이 카테고리의 뉴스 RSS 주소 목록.
#      여기 나온 헤드라인에 등장한 키워드만 이 카테고리로 판별한다 (기획서 5장).
#      아래 주소는 뼈대용 예시이며, 실제 사용할 섹션 RSS는 이슈 #4에서 확정한다.

categories:
  - id: entertainment
    name: 연예
    enabled: true
    rss:
      - name: 구글 뉴스 - 연예
        url: "https://news.google.com/rss/search?q=%EC%97%B0%EC%98%88&hl=ko&gl=KR&ceid=KR:ko"

  - id: sports
    name: 스포츠
    enabled: true
    rss:
      - name: 구글 뉴스 - 스포츠
        url: "https://news.google.com/rss/search?q=%EC%8A%A4%ED%8F%AC%EC%B8%A0&hl=ko&gl=KR&ceid=KR:ko"
