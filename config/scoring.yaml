# 점수·필터 기준값 (기획서 5장)
# 처음엔 감으로 정한 값이다. 주 1회 숫자만 바꾸고 PR로 이력을 남긴다.

# 규칙 필터 (깔때기 2단계)
filter:
  min_outlets: 2            # 최소 보도량: 다룬 언론사 수가 이 값 이상이어야 통과
  recent_check_hours: 24    # 최근에 확인한 소재는 이 시간 동안 다시 올리지 않음

# 국면 판단: 최근 수집 회차들 사이의 언급량 변화로 판단
phase:
  window: 3                 # 최근 몇 회차를 비교할지
  rising_ratio: 1.2         # 직전 대비 언급량이 이 배수 이상이면 "상승 중"
  falling_ratio: 0.8        # 직전 대비 이 배수 이하면 "하락", 그 사이면 "정점"

# 화제성 점수 가중치
weights:
  phase: 3.0                # 상승 국면
  cross_source: 2.0         # 트렌드·뉴스 교차 등장
  coverage: 1.0             # 보도량 (언론사 수)
  watchlist: 1.5            # 워치리스트 가산점
  instagram: 0.0            # 인스타 반응 (2단계부터 사용)

# 카테고리마다 규모가 달라서, 점수를 카테고리 안의 상대 순위로 보정할지
normalize_within_category: true

# 보드 표시
board:
  top_n_expanded: 5         # "지금 뜨는 것"에서 크게 보여줄 개수
  upcoming_days: 7          # "곧 올 것"에 보여줄 기간 (일)
